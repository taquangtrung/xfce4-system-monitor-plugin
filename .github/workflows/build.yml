name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxfce4panel-2.0-dev libxfce4util-dev libgtk-3-dev \
            libnotify-dev build-essential pkg-config

      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -g -Wall -Wextra -Werror -fPIC"

      - name: Check that every symbol resolves
        run: ldd -r libsystem-monitor.so

      - name: Build the .deb package
        run: make deb SUDO=

      - name: Check the staged install layout
        run: |
          make stage DESTDIR="$PWD/build/check" PREFIX=/usr
          ls -lR build/check
